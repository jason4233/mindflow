name: Build and publish Android release

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "index.html"
      - "editor.html"
      - "css/**"
      - "js/**"
      - "assets/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mindflow-android-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Verify mobile contracts
        working-directory: mobile
        run: npm test

      - name: Sync current web assets into Android
        working-directory: mobile
        run: npm run sync

      - name: Build release APK
        working-directory: mobile/android
        run: bash ./gradlew --no-daemon assembleRelease

      # Release variants are unsigned by default；CI 產生一次性 keystore，APK 可直接側載但不冒充正式商店簽章。
      - name: Sign and verify installable APK
        shell: bash
        run: |
          set -euo pipefail
          unsigned_apk="mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          signed_apk="$RUNNER_TEMP/MindFlow.apk"
          aligned_apk="$RUNNER_TEMP/MindFlow-aligned.apk"
          keystore="$RUNNER_TEMP/mindflow-ci.keystore"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          zipalign="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"

          test -f "$unsigned_apk"
          test -n "$apksigner"
          test -n "$zipalign"
          keytool -genkeypair -noprompt \
            -keystore "$keystore" \
            -storepass android \
            -alias mindflow-ci \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MindFlow CI, OU=CI, O=MindFlow, L=Taipei, ST=Taiwan, C=TW"
          "$zipalign" -f -p 4 "$unsigned_apk" "$aligned_apk"
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$signed_apk" \
            "$aligned_apk"
          "$apksigner" verify --verbose --print-certs "$signed_apk"

      - name: Upload MindFlow.apk to rolling latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          main_sha="$(gh api "repos/$repo/commits/main" --jq ".sha")"

          # 舊 run 重跑時不能覆蓋 main 當前版本的 APK。
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping latest upload: main is at $main_sha but this run built $GITHUB_SHA."
            exit 0
          fi

          if ! gh release view latest --repo "$repo" >/dev/null 2>&1; then
            gh release create latest \
              --title "MindFlow latest" \
              --notes "Automated rolling MindFlow builds." \
              --target "$GITHUB_SHA" \
              --latest \
              --repo "$repo" || gh release view latest --repo "$repo" >/dev/null
          fi

          gh release upload latest "$RUNNER_TEMP/MindFlow.apk" --clobber --repo "$repo"
