name: Build and publish desktop release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mindflow-desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build setup and portable executables
        working-directory: desktop
        run: npm run build

      - name: Verify fixed release filenames
        shell: pwsh
        run: |
          $assets = @(
            "desktop/dist/MindFlow-Setup.exe",
            "desktop/dist/MindFlow-portable.exe"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "electron-builder output not found: $asset"
            }
          }

      - name: Publish GitHub releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setupAsset = "desktop/dist/MindFlow-Setup.exe"
          $portableAsset = "desktop/dist/MindFlow-portable.exe"
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:GITHUB_REF_NAME
          $timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss 'UTC'")
          $notes = @"
          Automated Windows setup and portable builds.

          Commit: $env:GITHUB_SHA
          Updated: $timestamp
          "@

          if ($env:GITHUB_REF_TYPE -eq "tag" -and $tag -like "v*") {
            $null = gh release view $tag --repo $repo 2>$null
            $versionReleaseExists = $LASTEXITCODE -eq 0

            if ($versionReleaseExists) {
              gh release upload $tag $setupAsset $portableAsset --clobber --repo $repo
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to replace assets on version release $tag"
              }
            } else {
              gh release create $tag $setupAsset $portableAsset `
                --verify-tag `
                --generate-notes `
                --title "MindFlow $tag" `
                --latest=false `
                --repo $repo
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to create version release $tag"
              }
            }
          }

          $null = gh release view latest --repo $repo 2>$null
          $rollingReleaseExists = $LASTEXITCODE -eq 0

          if ($rollingReleaseExists) {
            gh release edit latest `
              --title "MindFlow Latest Build" `
              --notes $notes `
              --target $env:GITHUB_SHA `
              --latest `
              --repo $repo
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to update rolling release metadata"
            }
          } else {
            gh release create latest `
              --title "MindFlow Latest Build" `
              --notes $notes `
              --target $env:GITHUB_SHA `
              --latest `
              --repo $repo
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create rolling release"
            }
          }

          gh release upload latest $setupAsset $portableAsset --clobber --repo $repo
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload rolling release assets"
          }
