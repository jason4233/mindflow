name: Build and publish desktop release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mindflow-desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Electron 與 electron-builder 的二進位不在 node_modules 裡，setup-node 的 npm 快取抓不到。
      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # 打包產物的版本號要跟 tag 一致，否則安裝檔永遠停在 package.json 寫死的版本。
      - name: Stamp the release version from the tag
        if: github.ref_type == 'tag'
        working-directory: desktop
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          npm version $version --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to stamp desktop package version $version"
          }

      - name: Build setup and portable executables
        working-directory: desktop
        run: npm run build

      - name: Verify fixed release filenames
        shell: pwsh
        run: |
          $assets = @(
            "desktop/dist/MindFlow-Setup.exe",
            "desktop/dist/MindFlow-portable.exe"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "electron-builder output not found: $asset"
            }
          }

      - name: Publish GitHub releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setupAsset = "desktop/dist/MindFlow-Setup.exe"
          $portableAsset = "desktop/dist/MindFlow-portable.exe"
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:GITHUB_REF_NAME
          $timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss 'UTC'")
          $notes = @"
          Automated Windows setup and portable builds.

          Commit: $env:GITHUB_SHA
          Updated: $timestamp
          "@

          if ($env:GITHUB_REF_TYPE -eq "tag" -and $tag -like "v*") {
            $null = gh release view $tag --repo $repo 2>$null
            $versionReleaseExists = $LASTEXITCODE -eq 0

            if ($versionReleaseExists) {
              gh release upload $tag $setupAsset $portableAsset --clobber --repo $repo
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to replace assets on version release $tag"
              }
            } else {
              gh release create $tag $setupAsset $portableAsset `
                --verify-tag `
                --generate-notes `
                --title "MindFlow $tag" `
                --latest=false `
                --repo $repo
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to create version release $tag"
              }
            }
          }

          # 重跑一個舊 workflow 會把 latest 指回舊 commit，等於對使用者發降版。
          # main 的當前 HEAD 不是這次建的東西，就整段跳過（版本 release 已在上面處理完）。
          $mainSha = (gh api "repos/$repo/commits/main" --jq ".sha" 2>$null | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read the current HEAD of main"
          }
          if ($mainSha -ne $env:GITHUB_SHA) {
            Write-Host "Skipping the rolling latest release: main is at $mainSha but this run built $env:GITHUB_SHA."
            exit 0
          }

          $null = gh release view latest --repo $repo 2>$null
          $rollingReleaseExists = $LASTEXITCODE -eq 0

          if ($rollingReleaseExists) {
            gh release edit latest `
              --title "MindFlow Latest Build" `
              --notes $notes `
              --target $env:GITHUB_SHA `
              --latest `
              --repo $repo
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to update rolling release metadata"
            }
          } else {
            gh release create latest `
              --title "MindFlow Latest Build" `
              --notes $notes `
              --target $env:GITHUB_SHA `
              --latest `
              --repo $repo
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create rolling release"
            }
          }

          gh release upload latest $setupAsset $portableAsset --clobber --repo $repo
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload rolling release assets"
          }
