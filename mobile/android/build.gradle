// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// MindFlow only calls BarcodeScanner.scan(), i.e. the Google code scanner that runs inside Google Play
// services. @capacitor-mlkit/barcode-scanning additionally depends on the *bundled* ML Kit barcode model
// (libbarhopper_v3.so for four ABIs, ~20 MB of the APK). Swap it for the API-identical unbundled
// artifact, whose model Play services downloads on demand; the plugin still compiles against it
// (checked by the build), and scan() already requires Play services anyway.
subprojects {
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute(module('com.google.mlkit:barcode-scanning'))
                .using(module('com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'))
                .because('keep the bundled ML Kit barcode model out of the APK; MindFlow uses the Play services code scanner')
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
